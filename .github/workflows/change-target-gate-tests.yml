name: Change target gate tests

on:
  pull_request:
    paths:
      - 'tools/change-target-gate.mjs'
      - 'tools/change-target-gate.test.mjs'
      - 'config/change-target-*.json'
      - 'skills/git-workflow/SKILL.md'
      - 'package.json'
      - '.github/workflows/change-target-gate-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/change-target-gate.mjs'
      - 'tools/change-target-gate.test.mjs'
      - 'config/change-target-*.json'
      - 'skills/git-workflow/SKILL.md'
      - 'package.json'
      - '.github/workflows/change-target-gate-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:change-target
