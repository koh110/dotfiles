approval_policy = "on-request"
default_permissions = "workspace_network"
approvals_reviewer = "auto_review"
model_reasoning_effort = "medium"
web_search = "live"
model = "gpt-5.6-terra"
service_tier = "default"

[permissions.workspace_network.filesystem]
glob_scan_max_depth = 8
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
"~/.zshenv" = "read"
"~/.codex" = "read"
"~/dev" = "read"
"~/dev/**" = "write"
"~/.local" = "read"
"~/.claude" = "write"
"~/.claude.json" = "write"
"~/.gitconfig" = "read"
"~/.config/git" = "read"
"/bin/sh" = "read"
"/usr/local/bin" = "read"
"/Library/Developer/CommandLineTools" = "read"
"/System/Library/OpenSSL/openssl.cnf" = "read"

[permissions.workspace_network.filesystem.":workspace_roots"]
"." = "write"
".git" = "write"
".codex" = "write"
".env" = "deny"
"**/.env" = "deny"

[permissions.workspace_network.network]
enabled = true
mode = "full"
allow_local_binding = true
